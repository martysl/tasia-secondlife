name: Build Tasia Viewer - Windows

on:
  push:
    branches:
      - tasia-features
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub pre-release"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTOBUILD_ADDRSIZE: 64
  AUTOBUILD_BUILD_ID: ${{ github.run_id }}
  AUTOBUILD_INSTALLABLE_CACHE: ${{ github.workspace }}/.autobuild-installables
  AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/.build-variables/variables
  AUTOBUILD_VCS_INFO: "true"
  AUTOBUILD_VSVER: 170
  # Keep empty: autobuild source_environment defaults it to "Visual Studio 17 2022",
  # which breaks compiler detection when combined with load_vsvars. Empty -> cmake
  # picks the default VS generator itself (Tasia pattern).
  AUTOBUILD_WIN_CMAKE_GEN: ""
  LL_SKIP_REQUIRE_SYSROOT: 1
  XZ_DEFAULTS: -T0

jobs:
  build:
    name: Build Tasia Viewer - Windows ${{ matrix.label }}
    runs-on: windows-2022
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: ReleaseFS_SL
            label: SecondLife
            zip_name: Tasia-Viewer-Windows-SL

    steps:
      - name: Checkout viewer source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore autobuild installables cache
        id: cache-autobuild
        uses: actions/cache@v4
        with:
          path: ${{ env.AUTOBUILD_INSTALLABLE_CACHE }}
          key: autobuild-windows-${{ hashFiles('autobuild.xml') }}

      - name: Install autobuild and Python deps
        run: pip install -r requirements.txt

      - name: Checkout build variables
        uses: actions/checkout@v4
        with:
          repository: FirestormViewer/fs-build-variables
          path: .build-variables

      - name: Remove KDU (proprietary, cannot use)
        shell: bash
        run: |
          autobuild installables remove kdu || true
          echo "KDU installable removed."

      - name: Load autobuild environment
        shell: bash
        run: |
          autobuild source_environment > .source_env
          . .source_env
          # ReleaseFS_SL has no LL_BUILD_WINDOWS_RELEASEFS_SL mapping in fs-build-variables;
          # fall back to the Release flags so CMake's LL_BUILD check passes.
          if [ -z "${LL_BUILD:-}" ]; then
            echo "LL_BUILD was empty; using LL_BUILD_RELEASE"
            LL_BUILD="$LL_BUILD_RELEASE"
          fi
          # This is a distribution build, not a debugging build. /Zi makes the
          # Windows PCH compile exceed the hosted runner's time limit.
          LL_BUILD="${LL_BUILD//\/Zi/}"
          LL_BUILD_RELEASE="${LL_BUILD_RELEASE//\/Zi/}"
          echo "LL_BUILD=$LL_BUILD" >> "$GITHUB_ENV"
          echo "LL_BUILD_RELEASE=$LL_BUILD_RELEASE" >> "$GITHUB_ENV"

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: 2022

      - name: Install Windows build prerequisites
        shell: bash
        run: |
          choco install ninja --no-progress -y || true
          ninja --version
          cmake --version
          where cl

      - name: Set Tasia build metadata
        shell: bash
        run: |
          # NOTE: no 'revision' var — MSBuild crashes with "Item has already
          # been added. Key: 'revision'/'REVISION'" (case-insensitive collision).
          echo "VIEWER_VERSION_GITHASH=${GITHUB_SHA}" >> "$GITHUB_ENV"
          TASIA_SHORT_SHA="${GITHUB_SHA}"
          echo "TASIA_SHORT_SHA=${TASIA_SHORT_SHA::7}" >> "$GITHUB_ENV"
          echo "TASIA_DISPLAY_VERSION=7.2.4.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "TASIA_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Configure Windows
        shell: bash
        env:
          TASIA_GIPHY_API_KEY: ${{ secrets.TASIA_GIPHY_API_KEY }}
        run: |
          set -euo pipefail

          # Point CMake at the MSVC compiler explicitly (vswhere-based detection
          # fails inside git-bash on the runner; with CC/CXX set, both VS and
          # Ninja generators find cl.exe from the msvc-dev-cmd environment)
          export CC="cl.exe"
          export CXX="cl.exe"
          which cl

          # Use system CMake (default generator = Visual Studio 2022 -> Firestorm.sln;
          # VS-bundled CMake defaults to Ninja which breaks configure_firestorm.sh's msbuild step)
          cmake --version | head -1

          LOCAL_DIST_DIR="$(pwd)/build-vc170-64/newview/unpacked"
          # Clean build dir: stale CMakeCache.txt from earlier Ninja-generator
          # configure attempts conflicts with -G "Visual Studio 17 2022"
          rm -rf build-vc170-64
          mkdir -p "$LOCAL_DIST_DIR"

          # --- CMake smoke test: confirm VS generator + MSVC are visible ---
          mkdir -p /tmp/cmake-test && cd /tmp/cmake-test
          printf 'project(test C CXX)\nadd_executable(t main.c)\n' > CMakeLists.txt
          printf 'int main(void){return 0;}\n' > main.c
          cmake -G "" -A x64 . 2>&1 | tail -5 || true
          cd -

          autobuild configure \
            -c ${{ matrix.config }} \
            -A ${{ env.AUTOBUILD_ADDRSIZE }} \
            -- \
            --openal \
            --no-package \
            "-DLOCAL_DIST_DIR:PATH=$LOCAL_DIST_DIR"

      - name: Build Windows
        shell: bash
        run: |
          set -euo pipefail
          autobuild build \
            -c ${{ matrix.config }} \
            -A ${{ env.AUTOBUILD_ADDRSIZE }} \
            --no-configure \
            -- \
            --openal \
            --no-package

      - name: Bundle verified FFmpeg converter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          $expected = 'fec81ae03971d9dd4be3ebe02e263bd2ec1d789483f931bdba5f5715e65da2e9'
          $zip = Join-Path $env:RUNNER_TEMP 'tasia-ffmpeg-9.0.1-essentials.zip'
          $unpack = Join-Path $env:RUNNER_TEMP 'tasia-ffmpeg-9.0.1-essentials'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg SHA-256 mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $unpack -Force
          $root = Get-ChildItem -Path $unpack -Directory | Select-Object -First 1
          if (-not $root) { throw 'FFmpeg archive root not found' }
          $dist = Join-Path $env:GITHUB_WORKSPACE 'build-vc170-64/newview/unpacked'
          Copy-Item (Join-Path $root.FullName 'bin/ffmpeg.exe') (Join-Path $dist 'bin/tasia-ffmpeg.exe') -Force
          Copy-Item (Join-Path $root.FullName 'LICENSE') (Join-Path $dist 'bin/tasia-ffmpeg-license.txt') -Force
          & (Join-Path $dist 'bin/tasia-ffmpeg.exe') -version | Select-Object -First 1

      - name: Create Windows ZIP artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          dist = Path('build-vc170-64/newview/unpacked')
          if not dist.is_dir():
              raise SystemExit(f'Missing unpacked Windows dist: {dist}')
          archive = shutil.make_archive('${{ matrix.zip_name }}', 'zip', dist)
          print(f'Created {archive}')
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          if-no-files-found: error
          path: ${{ matrix.zip_name }}.zip

      - name: Publish GitHub prerelease - Windows
        if: inputs.publish_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v7.2.4-${GITHUB_RUN_NUMBER}"
          TITLE="Tasia Viewer 7.2.4.${GITHUB_RUN_NUMBER} Windows ${{ matrix.label }} Beta"
          NOTES="$(mktemp)"

          cat > "$NOTES" <<EOF
          Tasia Viewer Windows beta build.

          Version: 7.2.4.${GITHUB_RUN_NUMBER}
          Commit: ${GITHUB_SHA:0:7}
          Channel: Tasia Viewer
          Flavor: ${{ matrix.label }}
          Audio: OpenAL
          KDU: removed

          This is a beta/pre-release build. Mom must test before stable release.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ${{ matrix.zip_name }}.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" ${{ matrix.zip_name }}.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --prerelease
          fi
